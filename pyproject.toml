[project]
name = "mandate-engine"
version = "0.1.1"
description = "The agent proposes, the mandate decides: a policy layer outside the model for AI agents that move money, with provenance tracing and a hash-chained audit log."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "hoongyu" }]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
llm = ["litellm>=1.80"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
